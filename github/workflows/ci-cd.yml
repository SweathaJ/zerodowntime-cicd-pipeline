
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate project documentation
        run: |
          test -f README.md
          echo "Project documentation found."

      - name: Pipeline status
        run: echo "Initial CI pipeline completed successfully."
